version: '1.0.0'
services:
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5500:5500"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: